syntax = "proto3";

package common;

import "command.proto";
import "common.proto";
import "heartbeat.proto";

// Top-level message: type is the dispatch key and plugin_type is the routing
// key to the server plugin. Payloads are passed through per type.
message Envelope {
  MessageType type = 1;
  string plugin_type = 2;  // empty for non-plugin messages (reply/notify)
  // Scheduler-assigned client session. REGISTER requests leave this empty;
  // every other client message and server reply is bound to the session that
  // registered the client.
  string session_id = 14;

  oneof payload {
    RegisterCommand register = 3;
    RegisterResult register_result = 4;
    Heartbeat heartbeat = 5;
    RequestTaskCommand request_task = 6;
    TaskCommand task = 7;
    NoTaskCommand no_task = 8;
    TaskReport task_report = 9;
    WakeCommand wake = 10;
    StopCommand stop = 11;
    TaskAck task_ack = 12;
    TaskRejectCommand task_reject = 13;
  }
}
