syntax = "proto3";

package common;

// Framework-wide enums and shared value types. Stable across test programs.

// Dispatch key for Envelope payloads.
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;

  // Scheduler -> client commands.
  RUN_WAVE = 1;
  STOP = 2;
  SYNC_DATASET = 3;
  VERIFY_DATASET = 4;
  QUERY_STATUS = 5;
  UPDATE_PROGRAM = 6;

  // Client -> scheduler.
  HEARTBEAT = 10;

  // Replies.
  ACK = 20;
  RESPONSE = 21;
}

// Outcome of a command.
enum Status {
  STATUS_UNSPECIFIED = 0;
  OK = 1;
  FAILED = 2;
}

// One task inside a wave. Payload is opaque to the framework; the business
// module (e.g. stp) serializes its own task message into it and parses it
// back according to the wave's task_type.
message TaskSpec {
  string task_id = 1;
  bytes payload = 2;
}

message ResourceUsage {
  int32 cpu_percent = 1;
  int64 memory_bytes = 2;
  int64 disk_free_bytes = 3;
}
