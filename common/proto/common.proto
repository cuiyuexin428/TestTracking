syntax = "proto3";

package common;

// Framework/business boundary: the framework only reads the envelope header
// (type / plugin_type); all payloads are opaque business data that the
// framework passes through untouched.

// Envelope message types.
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;

  // Client -> scheduler.
  REGISTER = 1;        // register/validate (carries business validation message)
  HEARTBEAT = 2;       // status heartbeat
  REQUEST_TASK = 3;    // request a task (carries optional business request data)
  TASK_REPORT = 4;     // task execution report (carries business result)

  // Scheduler -> client.
  REGISTER_RESULT = 5; // registration validation result (carries business reply)
  TASK = 6;            // dispatch a single task
  NO_TASK = 7;         // no task available
  WAKE = 8;            // wake a sleeping client (reserved)
  STOP = 9;            // stop execution

  // Client -> scheduler.
  TASK_ACK = 10;       // task receipt: client confirms it received the task
}

// The task unit transported by the framework. plugin_type anchors both the
// client plugin and the server plugin; payload is opaque business content
// (e.g. the coverage file list) that the framework does not parse.
message Task {
  string task_id = 1;
  bytes payload = 2;
}

// Resource usage (health info), filled by the client and used by the
// scheduler for display and later load evaluation.
message ResourceUsage {
  int32 cpu_percent = 1;
  int64 memory_bytes = 2;
  int64 disk_free_bytes = 3;
}
