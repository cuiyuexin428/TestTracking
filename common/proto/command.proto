syntax = "proto3";

package common;

import "common.proto";

// Client registration/validation request. payload is the opaque business
// validation message; the framework routes it to the server plugin selected
// by Envelope.plugin_type and passes it through untouched. The client
// identity is the ZMQ identity frame; its IP is carried by Heartbeat.
message RegisterCommand {
  bytes payload = 1;
  // Client-generated nonce used to match a response to this registration
  // attempt when an earlier response is delayed in the transport.
  string registration_id = 2;
  // Framework wire protocol negotiated before plugin validation. A missing
  // value (zero) identifies a pre-handshake-version client and is rejected.
  uint32 protocol_version = 3;
  repeated string capabilities = 4;
}

// Registration validation result. payload is the opaque business reply
// (plugin-defined, e.g. deployment instructions); the framework does not
// know its structure and the client plugin parses it. plugin_found and
// reason are framework-level: plugin_found=false means the scheduler has no
// plugin for Envelope.plugin_type and the client must abort registration;
// reason is for logging/display only.
message RegisterResult {
  bytes payload = 1;
  bool plugin_found = 2;
  string reason = 3;
  bool accepted = 4;
  string registration_id = 5;
  uint32 protocol_version = 6;
  repeated string capabilities = 7;
}

// Client task request. count is the desired number of tasks: the scheduler
// returns up to count tasks in one reply (count <= 0 is answered with
// NO_TASK). payload is optional opaque business request data passed through
// to the server plugin.
message RequestTaskCommand {
  bytes payload = 1;
  int32 count = 2;
}

// Task dispatch: one or more tasks in a single reply. The framework grants
// up to RequestTaskCommand.count tasks; the client ACKs and executes each
// task independently.
message TaskCommand {
  string run_id = 1;
  repeated Task tasks = 2;
}

// No task available. Empty message; fields reserved for later use.
message NoTaskCommand {}

// Task receipt (client -> scheduler): the client confirms it received the
// dispatched task. Used with the in-flight lease to reclaim tasks when a
// client disconnects or a task gets stuck.
message TaskAck {
  string task_id = 1;
  string attempt_id = 2;
}

// Task rejection (client -> scheduler): the client received a task it cannot
// execute (defensive path). The scheduler removes the task from in-flight
// tracking and requeues it to the server plugin.
message TaskRejectCommand {
  string task_id = 1;
  string reason = 2;
  string attempt_id = 3;
}

// Wake a sleeping client (sent by the scheduler's wakeup command).
message WakeCommand {}

// Stop execution (server -> client). The server reclaims this client's
// in-flight tasks from its in_flight table; the client drops queued tasks.
message StopCommand {
  string run_id = 1;
  string reason = 2;
}

// Task execution report. result.payload is the opaque business result.
message TaskReport {
  TaskResult result = 1;
}

// Framework-level task result; the business result is serialized into
// result and parsed by the plugin selected by plugin_type.
message TaskResult {
  string task_id = 1;
  int32 exit_code = 2;
  int64 duration_ms = 3;
  string artifact_path = 4;
  bytes result = 5;
  string attempt_id = 6;
  string run_id = 7;
}

// Retried reports are idempotent. accepted means the framework and plugin
// progress are durable. A non-retryable rejection denotes an obsolete attempt.
message TaskReportAck {
  string task_id = 1;
  string attempt_id = 2;
  bool accepted = 3;
  bool retryable = 4;
  string reason = 5;
}
