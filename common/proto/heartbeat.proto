syntax = "proto3";

package common;

import "common.proto";

// Status heartbeat from client to scheduler. Mainly for display: users can
// see which clients exist and whether the count matches their configuration.
// plugin_type is carried by the Envelope.
message Heartbeat {
  string ip = 1;  // client-reported IP

  enum Status {
    IDLE = 0;
    BUSY = 1;
  }

  Status status = 2;
  ResourceUsage resource = 3;  // health data (memory etc.)
  string plugin_info = 4;  // opaque business info (e.g. versions) for display
}

message HeartbeatAck {
  string session_id = 1;
  bool registered = 2;
}
