syntax = "proto3";

package coverage;

// One task = a list of stp file names (relative paths).
message CoverageTask {
  string run_id = 1;
  int32 wave_id = 2;
  repeated string files = 3;
  // How many retries this task has already consumed (0 = first attempt).
  int32 retry_count = 4;
}

// Summary of a single stp file. The covered point set itself travels via the
// plugin's CoverageStore, not over the wire.
message FileCoverage {
  string file = 1;
  bool ok = 2;
  int32 covered_lines = 3;
}

message CoverageResult {
  repeated FileCoverage files = 1;
}

// Run checkpoint for resume after STOP or crash. remaining_tasks are the
// current wave's tasks not yet reported (excluding priority_tasks); future
// waves are rebuilt from the manifest on restore.
message CoverageCheckpoint {
  int32 current_wave = 1;
  int32 total_files = 2;
  int32 selected_files = 3;
  repeated bytes remaining_tasks = 4;  // serialized common::Task
  repeated bytes priority_tasks = 5;   // serialized common::Task
  // Fingerprint of the stp manifest the run was planned from, so restore
  // refuses to resume when the input dataset changed underneath it.
  string manifest_fingerprint = 6;
  // Monotonic task id counter for retry tasks (kept unique across restarts).
  int32 task_seq = 7;
}

// Registration validation: local deployment info of the client. It is the
// REGISTER business payload; the framework does not parse it and the
// coverage server plugin interprets it.
message CoverageClientInfo {
  string program_version = 1;
  string dataset_version = 2;
  bool deployed = 3;
}

// Server plugin reply: whether deployment is required plus target versions
// and source. It is the REGISTER_RESULT business reply; the framework does
// not parse it and the coverage client plugin interprets it.
message CoverageValidationReply {
  bool deploy_required = 1;
  string target_program_version = 2;
  string target_dataset_version = 3;
  string shared_dir = 4;
}
