syntax = "proto3";

package coverage;

// One task = a list of stp file names (relative paths). The server distributes
// tasks as a flat pool; there are no waves and no server-side settlement. The
// client owns execution and writes raw per-file results into the store.
message CoverageTask {
  string run_id = 1;
  repeated string files = 2;
  // Reserved for client-side retries; the server performs no file-level retries.
  int32 retry_count = 3;
  // Legacy field (removed): tasks used to carry a wave id. Kept reserved so
  // stale generated code cannot silently reuse the tag.
  reserved 4;
}

// Summary of a single stp file. The covered point set itself travels via the
// plugin's CoverageStore, not over the wire.
message FileCoverage {
  string file = 1;
  bool ok = 2;
  int32 covered_lines = 3;
}

message CoverageResult {
  repeated FileCoverage files = 1;
}

// Run checkpoint for resume after STOP or crash. The run is a flat task pool:
// at snapshot time remaining_tasks hold every task that is not finished yet
// (pending + in-flight), so restore re-dispatches them instead of dropping them.
message CoverageCheckpoint {
  // Checkpoint format version: 3 = flat dispatch (no waves, no settlement).
  int32 checkpoint_version = 1;
  int32 total_files = 2;
  // Fingerprint of the stp manifest the run was planned from, so restore
  // refuses to resume when the input dataset changed underneath it.
  string manifest_fingerprint = 3;
  // Serialized common::Task payloads still pending or in flight at snapshot.
  repeated bytes remaining_tasks = 4;
  // Serialized common::Task payloads reclaimed from clients; re-sent first.
  repeated bytes priority_tasks = 5;
  // Legacy fields removed by v3; preserved so old code cannot reuse the tags.
  reserved 6, 7, 8, 9, 10, 11;
}

// Registration validation: component versions of the client package. It is
// the REGISTER business payload; the framework does not parse it and the
// coverage server plugin interprets it. Versions come from version.txt files
// inside the package's testenv component folders.
message CoverageClientInfo {
  string program_version = 1;
  string dataset_version = 2;
}
